    // ==========================================
    // 6C. INTERACTIVE 3D TETRAHEDRON RENDERER
    // ==========================================
    function initAndDrawTetra3D() {
      const canvas = document.getElementById("tetraCanvas");
      if (!canvas) return;

      let dragging = false;
      let lastX = 0;
      let lastY = 0;

      canvas.onpointerdown = (e) => {
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        canvas.setPointerCapture(e.pointerId);
      };

      canvas.onpointermove = (e) => {
        if (!dragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        state.tetraYaw += dx * 0.012;
        state.tetraPitch = Math.max(-0.4, Math.min(1.25, state.tetraPitch + dy * 0.012));
        drawTetraScene(canvas);
      };

      canvas.onpointerup = () => {
        dragging = false;
      };

      drawTetraScene(canvas);
    }

    function drawTetraScene(canvas) {
      const dpr = window.devicePixelRatio || 1;
      const cssW = 270;
      const cssH = 240;
      canvas.width = cssW * dpr;
      canvas.height = cssH * dpr;
      canvas.style.width = `${cssW}px`;
      canvas.style.height = `${cssH}px`;

      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, cssW, cssH);

      const m = state.geoStep;
      const layerHeight = Math.sqrt(2 / 3) + state.tetraExplode;
      const spheres = [];

      for (let layer = 1; layer <= m; layer++) {
        const y = ((m - 1) / 2 - (layer - 1)) * layerHeight;
        const col = LAYER_COLOURS[(layer - 1) % LAYER_COLOURS.length];

        for (let i = 0; i < layer; i++) {
          const z = (i - (2 * (layer - 1)) / 3) * SQRT3_2;
          for (let j = 0; j <= i; j++) {
            const x = j - i / 2;

            const x1 = x * Math.cos(state.tetraYaw) + z * Math.sin(state.tetraYaw);
            const z1 = -x * Math.sin(state.tetraYaw) + z * Math.cos(state.tetraYaw);
            const y2 = y * Math.cos(state.tetraPitch) - z1 * Math.sin(state.tetraPitch);
            const z2 = y * Math.sin(state.tetraPitch) + z1 * Math.cos(state.tetraPitch);

            spheres.push({ x: x1, y: y2, z: z2, col });
          }
        }
      }

      spheres.sort((a, b) => a.z - b.z);

      const span = Math.max(2.2, m * 1.05 + state.tetraExplode * m * 0.6);
      const scale = 175 / span;
      const sphereR = Math.max(7, Math.min(22, scale * 0.48));
      const cx = cssW / 2;
      const cy = cssH / 2 + 6;

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, cssH - 22, Math.min(105, 32 + m * 11), 11, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(15, 23, 42, 0.10)";
      ctx.fill();
      ctx.restore();

      for (const s of spheres) {
        const sx = cx + s.x * scale;
        const sy = cy - s.y * scale;

        const grad = ctx.createRadialGradient(
          sx - sphereR * 0.34,
          sy - sphereR * 0.34,
          sphereR * 0.12,
          sx,
          sy,
          sphereR
        );
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.28, s.col.light);
        grad.addColorStop(0.72, s.col.bg);
        grad.addColorStop(1, s.col.dark);

        ctx.beginPath();
        ctx.arc(sx, sy, sphereR, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.lineWidth = 0.8;
        ctx.strokeStyle = "rgba(15, 23, 42, 0.25)";
        ctx.stroke();
      }
    }

    function drawSvgConnectors() {
      overlaySvg.innerHTML = "";
      const wrapperRect = triangleWrapper.getBoundingClientRect();
      overlaySvg.setAttribute("width", wrapperRect.width);
      overlaySvg.setAttribute("height", wrapperRect.height);

      function getCenter(r, k) {
        const el = triangleGrid.querySelector(`.cell[data-r="${r}"][data-k="${k}"]`);
        if (!el) return null;
        const rect = el.getBoundingClientRect();
        return {
          x: rect.left - wrapperRect.left + rect.width / 2,
          y: rect.top - wrapperRect.top + rect.height / 2
        };
      }

      function addLine(p1, p2, colour, width = 4, dash = "") {
        if (!p1 || !p2) return;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", p1.x);
        line.setAttribute("y1", p1.y);
        line.setAttribute("x2", p2.x);
        line.setAttribute("y2", p2.y);
        line.setAttribute("stroke", colour);
        line.setAttribute("stroke-width", width);
        line.setAttribute("stroke-linecap", "round");
        if (dash) line.setAttribute("stroke-dasharray", dash);
        overlaySvg.appendChild(line);
      }

      if (state.mode === "build") {
        const target = state.buildSubMode === "explore" ? state.hoveredCell : state.activeQuizCell;
        if (target && target.k > 0 && target.k < target.r) {
          const cChild = getCenter(target.r, target.k);
          const cLeft = getCenter(target.r - 1, target.k - 1);
          const cRight = getCenter(target.r - 1, target.k);
          addLine(cLeft, cChild, "#0284c7", 3, "4 3");
          addLine(cRight, cChild, "#7c3aed", 3, "4 3");
        }
      }

      if (state.mode === "patterns" && state.patternType === "hockey") {
        const { chain, turningCell } = getDiagonalAnalysis();
        const chainPts = chain.map((c) => getCenter(c.r, c.k)).filter(Boolean);
        for (let i = 0; i < chainPts.length - 1; i++) {
          addLine(chainPts[i], chainPts[i + 1], "#0284c7", 5);
        }
        if (state.hockeyShownForCurrent && chainPts.length > 0) {
          const turnPt = getCenter(turningCell.r, turningCell.k);
          addLine(chainPts[chainPts.length - 1], turnPt, "#d97706", 5);
        }
      }

      if (
        state.mode === "patterns" &&
        (state.patternType === "whole" ||
          state.patternType === "triangular" ||
          state.patternType === "tetrahedral")
      ) {
        const colouredHockey = getColouredPatternHockey();
        if (colouredHockey) {
          const points = [...colouredHockey.shaft, colouredHockey.blade]
            .map((c) => getCenter(c.r, c.k))
            .filter(Boolean);
          for (let i = 0; i < points.length - 1; i++) {
            const isBladeSegment = i === points.length - 2;
            addLine(points[i], points[i + 1], isBladeSegment ? "#f59e0b" : "#94a3b8", 4.5);
          }
        }
      }

      if (state.mode === "sums" && state.sumType === "fibonacci") {
        // Straight collinear dashed extensions along each shallow diagonal directly into its tilted box
        for (const node of fibNodePositions) {
          const isCurrent = !node.extra && node.m === state.fibIndex;
          addLine(
            { x: node.anchorX, y: node.anchorY },
            { x: node.edgeX, y: node.edgeY },
            isCurrent ? "#e11d48" : "#cbd5e1",
            isCurrent ? 3 : 1.8,
            "4 4"
          );
        }

        // Solid rose line connecting the cells along the selected shallow diagonal
        const fibCells = getFibonacciCells(state.fibIndex);
        const points = fibCells.map((c) => getCenter(c.r, c.k)).filter(Boolean);
        for (let i = 0; i < points.length - 1; i++) {
          addLine(points[i], points[i + 1], "#e11d48", 4.5);
        }
      }
    }

    // ==========================================
    // 7. FRACTAL ZOOM CANVAS RENDERER (Exact 60° Equilateral Triangle)
    // ==========================================
    let canvasGeometry = null;

    function renderFractalCanvas() {
      const N = state.fractalRows;
      const dpr = window.devicePixelRatio || 1;
      const width = Math.min(980, stageCard.clientWidth - 32);
      const height = Math.max(500, Math.min(760, width * 0.86));

      fractalCanvas.width = width * dpr;
      fractalCanvas.height = height * dpr;
      fractalCanvas.style.width = `${width}px`;
      fractalCanvas.style.height = `${height}px`;

      const ctx = fractalCanvas.getContext("2d");
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, width, height);

      const pad = 18;
      const usableW = width - pad * 2;
      const usableH = height - pad * 2;

      const dxW = usableW / N;
      const dxH = usableH / ((N - 1) * SQRT3_2 + 1);
      const dx = Math.min(dxW, dxH);
      const dy = dx * SQRT3_2;
      const radius = Math.max(0.55, dx * 0.44);

      const totalTriHeight = (N - 1) * dy + dx;
      const padY = (height - totalTriHeight) / 2 + dx * 0.5;

      canvasGeometry = { N, width, padY, dy, dx, radius };
      const modBig = BigInt(state.divisor);

      for (let r = 0; r < N; r++) {
        const y = padY + r * dy;
        const rowWidth = r * dx;
        const startX = width / 2 - rowWidth / 2;

        for (let k = 0; k <= r; k++) {
          const x = startX + k * dx;
          const rem = Number(pascalBig[r][k] % modBig);

          let fillStyle;
          if (state.colourMode === "multiples") {
            fillStyle = rem === 0 ? REMAINDER_COLOURS[0] : "rgba(51, 65, 85, 0.42)";
          } else {
            fillStyle = REMAINDER_COLOURS[rem % REMAINDER_COLOURS.length];
          }

          ctx.fillStyle = fillStyle;
          if (radius < 1.35) {
            const size = Math.max(1.1, radius * 2);
            ctx.fillRect(x - size / 2, y - size / 2, size, size);
          } else if (radius >= 4.5) {
            ctx.beginPath();
            for (let s = 0; s < 6; s++) {
              const angle = (Math.PI / 3) * s - Math.PI / 6;
              const px = x + radius * Math.cos(angle);
              const py = y + radius * Math.sin(angle);
              if (s === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      if (state.colourMode === "multiples") {
        fractalLegend.innerHTML = `
          <span class="legend-item"><span class="legend-swatch" style="background:${REMAINDER_COLOURS[0]}"></span>Multiple of ${state.divisor} (rem 0)</span>
          <span class="legend-item"><span class="legend-swatch" style="background:#334155"></span>Not divisible by ${state.divisor}</span>
        `;
      } else {
        let items = "";
        for (let i = 0; i < state.divisor; i++) {
          items += `<span class="legend-item"><span class="legend-swatch" style="background:${REMAINDER_COLOURS[i % REMAINDER_COLOURS.length]}"></span>Rem ${i}</span>`;
        }
        fractalLegend.innerHTML = items;
      }
    }

    fractalCanvas.addEventListener("mousemove", (e) => {
      if (!canvasGeometry) return;
      const rect = fractalCanvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      const { N, width, padY, dy, dx } = canvasGeometry;
      const r = Math.round((my - padY) / dy);
      if (r >= 0 && r < N) {
        const rowWidth = r * dx;
        const startX = width / 2 - rowWidth / 2;
        const k = Math.round((mx - startX) / dx);
        if (k >= 0 && k <= r) {
          const cellX = startX + k * dx;
          if (Math.abs(mx - cellX) <= Math.max(dx * 0.65, 5)) {
            const rem = Number(pascalBig[r][k] % BigInt(state.divisor));
            canvasTooltip.style.display = "block";
            canvasTooltip.style.left = `${e.clientX + 14}px`;
            canvasTooltip.style.top = `${e.clientY - 12}px`;
            canvasTooltip.innerHTML = `Row ${r}, Pos ${k} &bull; Remainder mod ${state.divisor}: <strong>${rem}</strong>`;
            return;
          }
        }
      }
      canvasTooltip.style.display = "none";
    });

    fractalCanvas.addEventListener("mouseleave", () => {
      canvasTooltip.style.display = "none";
    });

          state.userFoundMultiples.add(key);
          state.fractalFeedback = null;
          const target = getDiscoveryTargetCount(state.divisor);
          if (state.userFoundMultiples.size >= target) {
            state.zoomUnlocked = true;
            state.fractalFeedback = {
              type: "success",
              text: `Awesome! You found ${target} multiples of ${state.divisor}. Use the Zoom buttons above (up to 512 rows!) to watch the fractal emerge!`
            };
          }
          renderAll();
        } else {
          state.fractalFeedback = {
            type: "warn",
            text: `${val} is not a multiple of ${state.divisor} (${val} ÷ ${state.divisor} leaves remainder ${rem}).`
          };
          renderInsight();
          const el = triangleGrid.querySelector(`.cell[data-r="${r}"][data-k="${k}"]`);
          if (el) {
            el.classList.remove("shake");
            void el.offsetWidth;
            el.classList.add("shake");
          }
        }
      }
    }

    function submitOptionalDiagSum(e) {
      e.preventDefault();
      const inp = document.getElementById("diagSumInput");
      const raw = inp ? inp.value.trim() : "";
      if (!raw) return;

      let userVal;
      try {
        userVal = BigInt(raw);
      } catch {
        return;
      }

      const { targetVal } = getDiagonalAnalysis();
      if (userVal === targetVal) {
        state.diagSumVerified = true;
        state.diagMessage = "";
        renderInsight();
      } else {
        state.diagMessage = `Not quite — add the highlighted blue numbers again!`;
        renderInsight();
      }
    }

    function showHockeyStickNow() {
      state.hockeyShownForCurrent = true;
      renderAll();
    }

    function setDiagDir(dir) {
      state.diagDir = dir;
      state.diagFoundMatches = new Set();
      state.diagSumVerified = false;
      state.hockeyShownForCurrent = false;
      state.diagMessage = "";
      renderAll();
    }

    function submitInlineRowSum(r) {
      const inp = document.getElementById(`rowSumInput-${r}`);
      const raw = inp ? inp.value.trim() : "";
      if (!raw) return;

      let userVal;
      try {
        userVal = BigInt(raw);
      } catch {
        return;
      }

      const correctVal = 1n << BigInt(r);
      if (userVal === correctVal) {
        state.solvedRowSums.add(r);
        state.rowSumFeedback = "";
        let nextRow = null;
        for (let nr = r + 1; nr <= 8; nr++) {
          if (!state.solvedRowSums.has(nr)) {
            nextRow = nr;
            break;
          }
        }
        if (nextRow === null) {
          for (let nr = 3; nr <= 8; nr++) {
            if (!state.solvedRowSums.has(nr)) {
              nextRow = nr;
              break;
            }
          }
        }
        if (nextRow !== null) {
          state.selectedRow = nextRow;
        }
        renderAll();
      } else {
        state.rowSumFeedback = `Not quite — add all entries across Row ${r} again!`;
        renderInsight();
        if (inp) {
          inp.value = "";
          inp.focus();
        }
      }
    }

    function revealRowSumPattern() {
      state.rowSumPatternRevealed = true;
      renderAll();
    }

    function submitInlineAltSum(r) {
      const inp = document.getElementById(`altSumInput-${r}`);
      const raw = inp ? inp.value.trim() : "";
      if (raw === "") return;

      const userVal = Number(raw);
      const correctVal = r === 0 ? 1 : 0;
      if (userVal === correctVal) {
        state.solvedAltSums.add(r);
        state.altSumFeedback = "";
        let nextRow = null;
        for (let nr = r + 1; nr <= 8; nr++) {
          if (!state.solvedAltSums.has(nr)) {
            nextRow = nr;
            break;
          }
        }
        if (nextRow === null) {
          for (let nr = 3; nr <= 8; nr++) {
            if (!state.solvedAltSums.has(nr)) {
              nextRow = nr;
              break;
            }
          }
        }
        if (nextRow !== null) {
          state.selectedRow = nextRow;
        }
        renderAll();
      } else {
        state.altSumFeedback = `Not quite — alternate subtracting and adding from left to right across Row ${r}!`;
        renderInsight();
        if (inp) {
          inp.value = "";
          inp.focus();
        }
      }
    }

    function revealAltSumPattern() {
      state.altSumPatternRevealed = true;
      renderAll();
    }

    function resetRowSumChallenge() {
      if (state.sumType === "powers2") {
        state.solvedRowSums = new Set([0, 1, 2]);
        state.rowSumFeedback = "";
        state.rowSumPatternRevealed = false;
        state.selectedRow = 3;
      } else {
        state.solvedAltSums = new Set([0, 1, 2]);
        state.altSumFeedback = "";
        state.altSumPatternRevealed = false;
        state.selectedRow = 3;
      }
      renderAll();
    }

    function submitFibSum(m) {
      const inp = document.getElementById(`fibInput-${m}`);
      const raw = inp ? inp.value.trim() : "";
      if (!raw) return;

      let userVal;
      try {
        userVal = BigInt(raw);
      } catch {
        return;
      }

      const cells = getFibonacciCells(m);
      const correctVal = cells.reduce((acc, c) => acc + pascalBig[c.r][c.k], 0n);

      if (userVal === correctVal) {
        state.solvedFibDiags.add(m);
        state.fibFeedback = "";
        let nextM = null;
        for (let nm = m + 1; nm <= 8; nm++) {
          if (!state.solvedFibDiags.has(nm)) {
            nextM = nm;
            break;
          }
        }
        if (nextM === null) {
          for (let nm = 2; nm <= 8; nm++) {
            if (!state.solvedFibDiags.has(nm)) {
              nextM = nm;
              break;
            }
          }
        }
        if (nextM !== null) {
          state.fibIndex = nextM;
          const nextCells = getFibonacciCells(nextM);
          state.fibSeedCell = nextCells[0] || { r: 0, k: 0 };
        }
        renderAll();
      } else {
        state.fibFeedback = `Not quite — add the highlighted rose numbers along Diagonal ${m + 1} again!`;
        renderInsight();
        if (inp) {
          inp.value = "";
          inp.focus();
        }
      }
    }

    function selectFibDiagonal(m) {
      state.fibIndex = m;
      const cells = getFibonacciCells(m);
      state.fibSeedCell = cells[0] || { r: 0, k: 0 };
      state.fibFeedback = "";
      renderAll();
    }

    function revealAllFibDiags() {
      for (let m = 0; m <= 8; m++) state.solvedFibDiags.add(m);
      state.fibFeedback = "";
      renderAll();
    }

    function resetFibDiags() {
      state.solvedFibDiags = new Set([0, 1]);
      state.fibIndex = 2;
      state.fibSeedCell = { r: 2, k: 0 };
      state.fibFeedback = "";
      renderAll();
    }

    function jumpToHockeyInduction() {
      document.querySelectorAll(".tab-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.mode === "theory");
      });
      state.mode = "theory";
      state.theoryTopic = "induction";
      state.indProofType = "hockey";
      renderAll();
    }

    function submitQuizAnswer(e, r, k, sourceInputId) {
      e.preventDefault();
      const input = document.getElementById(sourceInputId) || document.getElementById("bannerQuizInput");
      const raw = input ? input.value.trim() : "";
      if (!raw) return;

      let userVal;
      try {
        userVal = BigInt(raw);
      } catch {
        return;
      }

      const correctVal = pascalBig[r][k];
      if (userVal === correctVal) {
        state.revealedSet.add(`${r},${k}`);
        state.buildMessage = "";
        advanceNextQuizCell();
        renderInsight();
        renderTriangleDOM();
      } else {
        const leftP = pascalBig[r - 1][k - 1];
        const rightP = pascalBig[r - 1][k];
        state.buildMessage = `Not quite — add ${leftP} + ${rightP} and try again!`;
        renderInsight();
        const cellInp = document.getElementById("cellQuizInput");
        const bannerInp = document.getElementById("bannerQuizInput");
        if (cellInp) {
          cellInp.value = "";
          cellInp.focus();
        }
        if (bannerInp) {
          bannerInp.value = "";
        }
      }
    }

    function solveNextCell() {
      if (!state.activeQuizCell) return;
      const { r, k } = state.activeQuizCell;
      state.revealedSet.add(`${r},${k}`);
      state.buildMessage = "";
      advanceNextQuizCell();
      renderInsight();
      renderTriangleDOM();
    }

    function advanceNextQuizCell() {
      for (let r = 2; r < state.rows; r++) {
        for (let k = 1; k < r; k++) {
          if (isCellSolvable(r, k)) {
            state.activeQuizCell = { r, k };
            return;
          }
        }
      }
      state.activeQuizCell = null;
    }

    function resetChallenge() {
      state.revealedSet = createInitialRevealedSet(15);
      state.activeQuizCell = { r: 2, k: 1 };
      state.buildMessage = "";
      renderInsight();
      renderTriangleDOM();
    }

    function setBuildSubMode(sub) {
      state.buildSubMode = sub;
      state.buildMessage = "";
      if (sub === "challenge" && !state.activeQuizCell) {
        advanceNextQuizCell();
      }
      renderAll();
    }

    function toggleBinomLabels() {
      state.showBinomLabels = !state.showBinomLabels;
      renderAll();
    }

    function setRows(val) {
      state.rows = Number(val);
      if (state.selectedRow >= state.rows) state.selectedRow = state.rows - 1;
      if (state.hoveredCell.r >= state.rows) state.hoveredCell = { r: state.rows - 1, k: 1 };
      if (state.buildSubMode === "challenge") {
        if (!state.activeQuizCell || state.activeQuizCell.r >= state.rows) {
          advanceNextQuizCell();
        }
      }
      renderAll();
    }

    function setPattern(type) {
      state.patternType = type;
      state.diagMessage = "";
      if (type === "whole" || type === "triangular") state.geoStep = 5;
      if (type === "tetrahedral") state.geoStep = 4;
      renderAll();
    }

    function setGeoStep(val) {
      state.geoStep = Number(val);
      renderInsight();
      renderTriangleDOM();
    }

    function setTetraExplode(val) {
      state.tetraExplode = Number(val);
      const canvas = document.getElementById("tetraCanvas");
      if (canvas) drawTetraScene(canvas);
    }

    function setSumType(type) {
      state.sumType = type;
      state.rowSumFeedback = "";
      state.altSumFeedback = "";
      state.fibFeedback = "";
      if ((type === "powers2" || type === "altsum") && state.selectedRow < 3) {
        state.selectedRow = 3;
      }
      renderAll();
    }

    function setBinomEval(mode) {
      state.binomEvalMode = mode;
      renderCompanionPanel();
    }

    function selectRow(r) {
      state.selectedRow = r;
      state.rowSumFeedback = "";
      state.altSumFeedback = "";
      renderAll();
    }

    function setDivisor(d) {
      state.divisor = Number(d);
      state.userFoundMultiples = new Set();
      state.fractalRows = 16;

      const availableIn16 = getAllMultiplesInRows(state.divisor, 16).length;
      if (availableIn16 === 0) {
        state.zoomUnlocked = true;
        state.fractalRows = 32;
        state.fractalFeedback = {
          type: "success",
          text: `No multiples of ${state.divisor} appear in the first 16 rows—zoomed out to 32 rows so you can see where they first emerge!`
        };
      } else {
        state.zoomUnlocked = false;
        state.fractalFeedback = null;
      }
      renderAll();
    }

    function unlockFractalNow() {
      state.zoomUnlocked = true;
      state.fractalFeedback = null;
      renderAll();
    }

    function setColourMode(cm) {
      state.colourMode = cm;
      renderAll();
    }

    function setFractalRows(z) {
      if (!state.zoomUnlocked && Number(z) > 16) return;
      state.fractalRows = Number(z);
      renderAll();
    }

    function setTheoryTopic(topic) {
      state.theoryTopic = topic;
      renderAll();
    }

    function setProofParams(n, r) {
      state.proofN = Number(n);
      state.proofR = Math.min(Number(r), state.proofN - 1);
      renderTheoryHub();
    }

    function setIndProofType(t) {
      state.indProofType = t;
      renderTheoryHub();
    }

    function setIndStepN(val) {
      state.indStepN = Number(val);
      renderTheoryHub();
    }

    function setCombParams(n, r) {
      state.combN = Number(n);
      state.combR = Math.min(Number(r), state.combN);
      renderTheoryHub();
    }

    // ==========================================
    // 10. MASTER RENDER ORCHESTRATOR
    // ==========================================
    function renderAll() {
      renderControls();
      renderInsight();

      const isFractal = state.mode === "fractals";
      const isTheory = state.mode === "theory";
      stageCard.classList.toggle("fractal-dark", isFractal);

      triangleWrapper.style.display = "none";
      companionSlot.style.display = "none";
      canvasContainer.style.display = "none";
      theoryHub.style.display = "none";

      if (isTheory) {
        theoryHub.style.display = "flex";
        renderTheoryHub();
      } else if (isFractal && state.fractalRows > 16) {
        canvasContainer.style.display = "flex";
        renderFractalCanvas();
      } else {
        triangleWrapper.style.display = "inline-flex";
        companionSlot.style.display = "flex";
        renderTriangleDOM();
      }
    }

    window.addEventListener("resize", () => {
      if (state.mode === "fractals" && state.fractalRows > 16) {
        renderFractalCanvas();
      } else if (state.mode !== "theory") {
        renderFibonacciDiagonalOverlay();
        drawSvgConnectors();
      }
    });

    // Initial boot
    renderAll();
  </script>
</body>
</html>
